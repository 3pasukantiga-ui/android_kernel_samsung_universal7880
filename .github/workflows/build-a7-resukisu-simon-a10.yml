name: Build a7y17lte ReSukiSU (Simon A10)

on:
  workflow_dispatch:

jobs:
  build:
    name: a7y17lte Simon A10 + ReSukiSU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Simon1511 rise
        uses: actions/checkout@v7
        with:
          repository: Simon1511/android_kernel_samsung_universal7880
          ref: rise
          fetch-depth: 1

      - name: Checkout zipper (AnyKernel3)
        uses: actions/checkout@v7
        with:
          repository: cyberc3dr/AnyKernel3
          path: zipper

      - name: Setup ReSukiSU + hooks + 3.18/DTB fixes
        run: |
          set -e

          DEFCONFIG=""
          for c in \
            arch/arm64/configs/rise-a7y17lte_defconfig \
            arch/arm64/configs/lineage-a7y17lte_defconfig \
            arch/arm64/configs/a7y17lte_defconfig
          do
            if [ -f "$c" ]; then DEFCONFIG="$c"; break; fi
          done
          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: defconfig a7 tidak ketemu"
            ls arch/arm64/configs/ | head -60
            exit 1
          fi
          echo "Using DEFCONFIG=$DEFCONFIG"
          DEFCONFIG_NAME=$(basename "$DEFCONFIG")
          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> "$GITHUB_ENV"

          echo "==> Official ReSukiSU setup.sh..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          if [ ! -e drivers/kernelsu ]; then
            if [ -d KernelSU/kernel ]; then
              ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu || {
                mkdir -p drivers/kernelsu
                cp -a KernelSU/kernel/. drivers/kernelsu/
              }
            fi
          fi

          if ! grep -q 'kernelsu' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          find KernelSU/kernel drivers/kernelsu -type f \( -name 'Kbuild' -o -name 'Makefile' -o -name '*.mk' \) 2>/dev/null | while read -r f; do
            sed -i 's/\$(error /\$(warning /g' "$f" || true
            sed -i 's/\( (error / \)(warning /g' "$f" || true
          done

          sed -i '/CONFIG_KSU/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KSU_MANUAL_HOOK/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KSU_SUSFS/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KPROBES/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KPROBE_EVENTS/d' "$DEFCONFIG" || true
          sed -i '/^CONFIG_MODULES=/d' "$DEFCONFIG" || true

          {
            echo 'CONFIG_MODULES=y'
            echo 'CONFIG_KPROBES=y'
            echo 'CONFIG_KPROBE_EVENTS=y'
            echo 'CONFIG_KSU=y'
            echo 'CONFIG_KSU_MANUAL_HOOK=y'
          } >> "$DEFCONFIG"
          grep CONFIG_KSU "$DEFCONFIG" || true

          find KernelSU/kernel drivers/kernelsu -type f \( -name 'Makefile' -o -name 'Kbuild' -o -name '*.mk' \) 2>/dev/null | while read -r f; do
            sed -i -E \
              -e 's/(^|[[:space:]])-Werror(=[^[:space:]]+)?($|[[:space:]])/\1\3/g' \
              -e 's/(^|[[:space:]])-Wno-error(=[^[:space:]]+)?($|[[:space:]])/\1\3/g' \
              -e 's/(^|[[:space:]])-Wno-discarded-qualifiers($|[[:space:]])/\1\2/g' \
              -e 's/(^|[[:space:]])-Wno-incompatible-pointer-types-discards-qualifiers($|[[:space:]])/\1\2/g' \
              -e 's/(^|[[:space:]])-Wno-macro-redefined($|[[:space:]])/\1\2/g' \
              -e 's/(^|[[:space:]])-Wno-int-conversion($|[[:space:]])/\1\2/g' \
              -e 's/(^|[[:space:]])-Wno-logical-not-parentheses($|[[:space:]])/\1\2/g' \
              -e 's/(^|[[:space:]])-Wno-implicit-function-declaration($|[[:space:]])/\1\2/g' \
              -e 's/(^|[[:space:]])-Wno($|[[:space:]])/\1\2/g' \
              "$f" || true
            echo 'ccflags-y += -Wno-error' >> "$f"
            echo 'subdir-ccflags-y += -Wno-error' >> "$f"
          done

          find KernelSU/kernel drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \) 2>/dev/null -print0 | xargs -0 sed -i \
            -e 's/static uintptr_t selinux_ops_addr = NULL;/static uintptr_t selinux_ops_addr = 0;/g' \
            -e 's/uintptr_t selinux_ops_addr = NULL;/uintptr_t selinux_ops_addr = 0;/g' \
            -e 's/ksu_sulog_emit(\([^,]*\), NULL, NULL,/ksu_sulog_emit(\1, NULL, 0,/g' \
            -e 's/copy_to_iter(KERNEL_SU_RC/copy_to_iter((void *)KERNEL_SU_RC/g' \
            || true

          # is_init (3.18)
          find KernelSU drivers/kernelsu -type f -name 'sucompat.c' 2>/dev/null | while read -r f; do
            sed -i 's/is_init(current_cred())/1/g' "$f" || true
            sed -i 's/is_init(current->cred)/1/g' "$f" || true
            sed -i 's/is_init([^)]*)/1/g' "$f" || true
            echo "patched is_init: $f"
          done

          # Manual hooks
          python3 -c '
          import re
          from pathlib import Path

          def R(p):
              return Path(p).read_text(encoding="utf-8", errors="ignore")

          def W(p, t):
              Path(p).write_text(t, encoding="utf-8")
              print("wrote", p)

          p, t = "fs/exec.c", R("fs/exec.c")
          if "ksu_handle_execveat" not in t and "ksu_handle_execve(" not in t:
              decl = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *__argv, void *__envp, int *flags);\n#endif\n"
              m = re.search(r"static\s+int\s+do_execveat_common\s*\([^)]*\)\s*\{", t)
              if m:
                  t = t[:m.start()] + decl + t[m.start():]
                  m2 = re.search(r"static\s+int\s+do_execveat_common\s*\([^)]*\)\s*\{", t)
                  if m2:
                      t = t[:m2.end()] + "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, NULL, NULL, &flags);\n#endif\n" + t[m2.end():]
                  W(p, t)
                  print("exec: hooked")
              else:
                  ref = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *a, void *b, int *flags);\nstatic int __maybe_unused ksu_execveat_anchor(void){int fd=0,fl=0; struct filename *fn=NULL; return ksu_handle_execveat(&fd,&fn,NULL,NULL,&fl);}\n#endif\n"
                  lines = t.splitlines(True)
                  out, done = [], False
                  for i, line in enumerate(lines):
                      out.append(line)
                      if not done and line.startswith("#include") and i + 1 < len(lines) and not lines[i+1].startswith("#include"):
                          out.append(ref)
                          done = True
                  if not done:
                      out.insert(min(40, len(out)), ref)
                  W(p, "".join(out))
                  print("exec: anchor")
          else:
              print("exec: already")

          p, t = "fs/open.c", R("fs/open.c")
          if "ksu_handle_faccessat" not in t:
              decl = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n"
              m = re.search(r"SYSCALL_DEFINE3\s*\(\s*faccessat\s*,", t)
              if m:
                  t = t[:m.start()] + decl + t[m.start():]
                  m2 = re.search(r"(SYSCALL_DEFINE3\s*\(\s*faccessat\s*,[\s\S]*?\))\s*\{", t)
                  if m2:
                      t = t[:m2.end()] + "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n" + t[m2.end():]
                  W(p, t)
                  print("open: ok")
              else:
                  print("open: missing")
          else:
              print("open: already")

          p, t = "fs/stat.c", R("fs/stat.c")
          if "ksu_handle_stat" not in t:
              decl = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\nextern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n#endif\n"
              m = re.search(r"SYSCALL_DEFINE4\s*\(\s*newfstatat\s*,", t)
              if m:
                  t = t[:m.start()] + decl + t[m.start():]
                  m2 = re.search(r"(SYSCALL_DEFINE4\s*\(\s*newfstatat\s*,[\s\S]*?\))\s*\{", t)
                  if m2:
                      t = t[:m2.end()] + "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n" + t[m2.end():]
                  W(p, t)
                  print("stat: ok")
              else:
                  W(p, decl + t)
                  print("stat: decl only")
          t = R("fs/stat.c")
          if "ksu_handle_newfstat_ret" not in t or "ksu_handle_fstat64_ret" not in t:
              extra = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\nextern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\nstatic void __maybe_unused ksu_fstat_ret_anchor(void){unsigned int fd=0; unsigned long fdl=0; struct stat __user *s=NULL; struct stat64 __user *s64=NULL; ksu_handle_newfstat_ret(&fd,&s); ksu_handle_fstat64_ret(&fdl,&s64);}\n#endif\n"
              W("fs/stat.c", extra + R("fs/stat.c"))
              print("stat: ret anchor")
          else:
              print("stat: ret already")

          for cand in ("kernel/reboot.c", "kernel/sys.c"):
              if not Path(cand).exists():
                  continue
              t = R(cand)
              if "ksu_handle_sys_reboot" in t:
                  print(cand, "already")
                  break
              decl = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n"
              m = re.search(r"SYSCALL_DEFINE4\s*\(\s*reboot\s*,", t)
              if m:
                  t = t[:m.start()] + decl + t[m.start():]
                  m2 = re.search(r"(SYSCALL_DEFINE4\s*\(\s*reboot\s*,[\s\S]*?\))\s*\{", t)
                  if m2:
                      t = t[:m2.end()] + "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n" + t[m2.end():]
                  W(cand, t)
                  print(cand, "reboot ok")
                  break

          for s in ("ksu_handle_execveat", "ksu_handle_faccessat", "ksu_handle_stat", "ksu_handle_newfstat_ret", "ksu_handle_fstat64_ret"):
              found = any(s in f.read_text(encoding="utf-8", errors="ignore") for root in (Path("fs"), Path("kernel")) for f in root.rglob("*.c"))
              print(("FOUND" if found else "MISSING"), s)
          print("HOOKS_END_OK")
          '

          # DTB: common.dtsi hilang di Simon
          DTS_DIR="arch/arm64/boot/dts"
          NEED="$DTS_DIR/exynos7880-a7y17lte_common.dtsi"
          echo "=== DTS a7 listing ==="
          ls "$DTS_DIR"/*a7y17lte* 2>/dev/null || true
          ls "$DTS_DIR"/*7880*common* 2>/dev/null || true

          if [ ! -f "$NEED" ]; then
            ALT=""
            for a in \
              "$DTS_DIR/exynos7880-a7y17lte-common.dtsi" \
              "$DTS_DIR/exynos7880-a5y17lte_common.dtsi" \
              "$DTS_DIR/exynos7880-common.dtsi"
            do
              if [ -f "$a" ]; then ALT="$a"; break; fi
            done
            if [ -n "$ALT" ]; then
              cp -a "$ALT" "$NEED"
              echo "Copied $ALT -> $NEED"
            else
              cat > "$NEED" << 'EOF'
/* auto-stub missing a7y17lte_common.dtsi */
EOF
              echo "Created stub $NEED"
            fi
          else
            echo "DTS common OK"
          fi

          # Cadangan: buang target dtb a7 yang broken (Image tetap di-build)
          if [ -f arch/arm64/boot/dts/Makefile ]; then
            sed -i '/exynos7880-a7y17lte_eur_open_00/d' arch/arm64/boot/dts/Makefile || true
            echo "Dropped broken a7 open_00 dtb target if present"
          fi

          ls -la drivers/kernelsu 2>/dev/null | head -5 || true
          test -d KernelSU/.git && echo "KernelSU.git OK" || echo "WARN no .git"
          echo "FIX_3_18_AND_DTB_OK"
          echo "==> setup done"

      - name: Build Android Kernel for a7y17lte
        uses: cyberc3dr/android-kernel-actions@a57y17lte
        env:
          NAME: a7y17lte-resukisu-simon-a10
        with:
          arch: arm64
          defconfig: ${{ env.DEFCONFIG_NAME }}
          image: Image

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: a7y17lte-resukisu-simon-a10
          path: zipper/*.zip
          if-no-files-found: error
