name: Build a7y17lte KernelSU (Android 10)

on:
  workflow_dispatch:

jobs:
  build:
    name: a7y17lte A10 + backslashxx KernelSU
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source (branch rise)
        uses: actions/checkout@v7
        with:
          ref: rise
          fetch-depth: 1

      - name: Checkout zipper (AnyKernel3)
        uses: actions/checkout@v7
        with:
          repository: cyberc3dr/AnyKernel3
          path: zipper

      - name: Add backslashxx KernelSU + defconfig A10
        run: |
          set -e

          DEFCONFIG=""
          for c in \
            arch/arm64/configs/rise-a7y17lte_defconfig \
            arch/arm64/configs/lineage-a7y17lte_defconfig \
            arch/arm64/configs/a7y17lte_defconfig \
            arch/arm64/configs/exynos7880-a7y17lte_defconfig
          do
            if [ -f "$c" ]; then
              DEFCONFIG="$c"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: defconfig a7 tidak ketemu"
            ls arch/arm64/configs/ | head -60
            exit 1
          fi

          DEFCONFIG_NAME=$(basename "$DEFCONFIG")
          echo "Using DEFCONFIG=$DEFCONFIG"
          echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> "$GITHUB_ENV"

          echo "==> Clone backslashxx KernelSU..."
          git clone --depth=1 https://github.com/backslashxx/KernelSU.git ksu_temp

          if [ -d "ksu_temp/kernel" ]; then
            echo "Found ksu_temp/kernel → copying..."
            rm -rf drivers/kernelsu
            cp -r ksu_temp/kernel drivers/kernelsu
          else
            echo "No kernel folder → copy entire repo..."
            rm -rf drivers/kernelsu
            mkdir -p drivers/kernelsu
            cp -r ksu_temp/* drivers/kernelsu/
          fi
          rm -rf ksu_temp

          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q 'kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          sed -i '/CONFIG_KSU/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_KSU_TAMPER_SYSCALL_TABLE/d' "$DEFCONFIG" || true
          echo 'CONFIG_KSU=y' >> "$DEFCONFIG"
          echo 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' >> "$DEFCONFIG"
          grep CONFIG_KSU "$DEFCONFIG" || true

          find drivers/kernelsu -type f \( -name 'Makefile' -o -name 'Kbuild' -o -name '*.mk' \) | while read -r f; do
            sed -i -E 's/(^|[[:space:]])-Werror=[^[:space:]]+//g' "$f" || true
            sed -i -E 's/(^|[[:space:]])-Werror($|[[:space:]])/\1\2/g' "$f" || true
            echo 'ccflags-y += -Wno-error' >> "$f"
            echo 'subdir-ccflags-y += -Wno-error' >> "$f"
          done

          find drivers/kernelsu -type f \( -name 'Makefile' -o -name 'Kbuild' -o -name '*.mk' -o -name '*.c' -o -name '*.h' \) | while read -r f; do
            sed -i \
              -e 's/-Wno-discarded-qualifiers//g' \
              -e 's/-Wno-incompatible-pointer-types-discards-qualifiers//g' \
              -e 's/-Wno-macro-redefined//g' \
              -e 's/-Wno-int-conversion//g' \
              "$f" || true
          done

          find drivers/kernelsu -type f \( -name 'Makefile' -o -name 'Kbuild' -o -name '*.mk' \) | while read -r f; do
            sed -i -E 's/(^|[[:space:]])-implicit-function-declaration($|[[:space:]])/\1\2/g' "$f" || true
          done

          find drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 sed -i \
            -e 's/static uintptr_t selinux_ops_addr = NULL;/static uintptr_t selinux_ops_addr = 0;/g' \
            -e 's/uintptr_t selinux_ops_addr = NULL;/uintptr_t selinux_ops_addr = 0;/g' \
            -e 's/ksu_sulog_emit(\([^,]*\), NULL, NULL,/ksu_sulog_emit(\1, NULL, 0,/g' \
            -e 's/copy_to_iter(KERNEL_SU_RC/copy_to_iter((void *)KERNEL_SU_RC/g' \
            || true

          ls drivers/kernelsu | head -15
          echo "==> KernelSU setup done"

      - name: Fix missing a7 DTS (common.dtsi)
        run: |
          set -e
          DTS=arch/arm64/boot/dts
          echo "=== DTS a7 sebelum fix ==="
          ls -la "$DTS" | grep -i a7 || true

          BASE="https://raw.githubusercontent.com/LineageOS/android_kernel_samsung_universal7880/lineage-18.1/arch/arm64/boot/dts"

          if [ ! -f "$DTS/exynos7880-a7y17lte_common.dtsi" ]; then
            echo "==> common.dtsi hilang → download dari LineageOS lineage-18.1"
          else
            echo "==> common.dtsi sudah ada, tetap lengkapi file terkait jika kurang"
          fi

          for f in \
            exynos7880-a7y17lte_common.dtsi \
            exynos7880-a7y17lte_eur_open_00.dts \
            exynos7880-a7y17lte_eur_open_01.dts \
            exynos7880-a7y17lte_eur_open_02.dts \
            exynos7880-a7y17lte_eur_open_03.dts \
            exynos7880-a7y17lte_eur_open_05.dts \
            exynos7880-a7y17lte_eur_open_07.dts \
            exynos7880-a7y17lte_eur_open_08.dts \
            exynos7880-a7y17lte_eur_open_09.dts \
            exynos7880-a7y17lte_eur_open_10.dts
          do
            if [ ! -f "$DTS/$f" ]; then
              if curl -fsSL "$BASE/$f" -o "$DTS/$f"; then
                echo "OK  $f"
              else
                echo "SKIP $f (404/not found)"
                rm -f "$DTS/$f"
              fi
            else
              echo "HAVE $f"
            fi
          done

          # Coba branch lain kalau common masih kosong
          if [ ! -f "$DTS/exynos7880-a7y17lte_common.dtsi" ]; then
            echo "==> Coba lineage-17.1 ..."
            BASE17="https://raw.githubusercontent.com/LineageOS/android_kernel_samsung_universal7880/lineage-17.1/arch/arm64/boot/dts"
            curl -fsSL "$BASE17/exynos7880-a7y17lte_common.dtsi" -o "$DTS/exynos7880-a7y17lte_common.dtsi" || true
          fi

          if [ ! -f "$DTS/exynos7880-a7y17lte_common.dtsi" ]; then
            echo "ERROR: exynos7880-a7y17lte_common.dtsi tetap tidak ada"
            ls -la "$DTS" | head -80
            exit 1
          fi

          echo "=== VERIFY ==="
          ls -la "$DTS/exynos7880-a7y17lte_common.dtsi"
          head -8 "$DTS/exynos7880-a7y17lte_common.dtsi"
          echo "DTS_A7_OK"

      - name: Build Android Kernel for a7y17lte
        uses: cyberc3dr/android-kernel-actions@a57y17lte
        id: build
        env:
          NAME: a7y17lte-ksu-a10
        with:
          arch: arm64
          defconfig: ${{ env.DEFCONFIG_NAME }}
          image: Image

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: a7y17lte-ksu-a10
          path: zipper/*.zip
          if-no-files-found: error
